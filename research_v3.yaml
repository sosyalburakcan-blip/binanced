# Araştırma v3 — kısa vadeli trend: günlük, 2–3 günlük, haftalık (PREREGISTRATION_v3.md).
# Motor, maliyet, dolum, evren ve delist kuralları settings.yaml'dan (v1 ile aynı); yürütme trend.alt.base (v2 ile
# aynı). Ön kayıttan (tag prereg-v3) sonra her değişiklik experiments.md'ye yazılır ve N'ye eklenir.

tag: v3
title: "Araştırma v3 — kısa vadeli trend (günlük, 2–3 günlük, haftalık)"
prereg: PREREGISTRATION_v3.md
prereg_tag: prereg-v3
report: V3_short_trend.md

lock_date: "2026-11-01"              # G12 anlık görüntüsü (lock/LOCK.json); veri değişmez
design: ["2019-07-01", "2023-12-31"]
holdout_start: "2024-01-01"           # kirlenmiş bekletme dönemi

common:                              # v2 ile aynı (XS_MOM boyutlandırması)
  vol_window: 60
  vol_min_obs: 30
  sigma_target: 0.35
  cov_window: 60
  cov_min_obs: 30
  drift_band: 0.25
  tier_caps: false

families:                            # temel ayar + tek eksenli komşular; leak_days = bir karar dönemi
  TS_D:                              # BTC günlük trend: son k günün getirisi > 0 → %100 BTC, her gün karar
    base: {lookback: 1, every: 1}
    grid: {lookback: [2, 3]}
    leak_days: 1
  TS_W:                              # BTC haftalık trend: son k günün getirisi > 0 → %100 BTC, haftada bir karar
    base: {lookback: 7, every: 7}
    grid: {lookback: [14, 28]}
    leak_days: 7
  XS_MOM:                            # kesitsel haftalık momentum: son L günde en çok yükselen N coin
    base: {lookback: 7, n_hold: 5, every: 7}
    grid: {lookback: [3, 14], n_hold: [3, 10], every: [3, 14]}
    leak_days: 7

evaluation:
  alpha: 0.05
  n_families: 3                      # Bonferroni: p < 0,05 / 3
  n_control_seeds: 5
  dsr_trials_prior: 62               # v1 ızgara + varyant (35) + v2 adayları (27)
  leak_min_gain: 1.0                 # pozitif kontrol (trend kuralı): bir karar dönemi sızıntı → Sharpe ≥ temel + 1
  lag_max_ratio: 0.5
  neighbor_min_ratio: 0.5
  pbo_max: 0.5
