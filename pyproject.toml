[project]
name = "trend"
version = "0.1.0"
description = "Binance spot, long-only, günlük trend takip sistemi — araştırma ve backtest altyapısı (SPEC.md)"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6.0",
    "requests>=2.32",
    "scipy>=1.13",
    "websockets>=14",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: gerçek ağ erişimi gerektiren testler (varsayılan olarak atlanır; -m network ile çalışır)",
    "data: indirilmiş gerçek veri gerektiren testler (data/clean yoksa atlanır)",
]
addopts = "-m 'not network'"
