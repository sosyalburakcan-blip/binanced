# Araştırma v2 — trend takibi dışındaki aday stratejiler (PREREGISTRATION_v2.md).
# Motor, maliyet, dolum, evren ve delist kuralları settings.yaml'dan (v1 ile aynı); burada yalnızca adayların
# parametreleri var. Ön kayıttan (tag prereg-v2) sonra her değişiklik experiments.md'ye yazılır ve N'ye eklenir.

lock_date: "2026-11-01"              # G12 anlık görüntüsü (lock/LOCK.json); veri değişmez
design: ["2019-07-01", "2023-12-31"]  # tasarım dönemi: PBO, sıfır hipotezleri, kontroller
holdout_start: "2024-01-01"           # kirlenmiş bekletme dönemi (bkz. PREREGISTRATION_v2 §2)

common:
  vol_window: 60                     # kesitsel adaylarda ham ağırlık 1/σ ve seçim dışı oynaklık
  vol_min_obs: 30
  sigma_target: 0.35                 # kesitsel adayların portföy oynaklık hedefi (T0 ile aynı)
  cov_window: 60
  cov_min_obs: 30
  drift_band: 0.25                   # kesitsel adaylarda yeniden dengeleme bandı (T0 drift_rel ile aynı)
  tier_caps: false                   # kesitsel adaylarda v1 kademe tavanları (%10/%5/%3) uygulanmaz (PREREGISTRATION_v2 §4)

families:                            # temel ayar + tek eksenli komşular (her eksende iki değer)
  XS_REV:                            # kesitsel kısa vadeli geri dönüş: en çok düşen N coin
    base: {lookback: 7, n_hold: 5, every: 7}
    grid: {lookback: [3, 14], n_hold: [3, 10], every: [3, 14]}
  XS_LOWVOL:                         # düşük oynaklık anomalisi: en düşük oynaklıklı N coin
    base: {window: 60, n_hold: 5, every: monthly}
    grid: {window: [30, 120], n_hold: [3, 10]}
  VM_BTC:                            # oynaklığa göre yönetilen BTC: w = min(1, σ*/σ̂)
    base: {sigma_target: 0.50, window: 30, band: 0.20}
    grid: {sigma_target: [0.35, 0.65], window: [14, 60]}
  MR_BTC:                            # BTC z-skoru geri dönüşü: z < −e al, z ≥ 0 veya W gün sonra sat
    base: {window: 20, entry_z: 2.0}
    grid: {window: [10, 40], entry_z: [1.5, 2.5]}
  RV_ETHBTC:                         # ETH/BTC oran geri dönüşü: ucuz olanı tut, arada 50/50
    base: {window: 90, z_band: 1.0, band: 0.25}
    grid: {window: [45, 180], z_band: [0.5, 1.5]}

evaluation:
  alpha: 0.05
  n_families: 5                      # Bonferroni: birincil test her aile için p < alpha / n_families
  n_control_seeds: 5                 # ortalamadan arındırılmış karıştırma ve GARCH panelleri
  dsr_trials_v1: 35                  # v1 ızgara (11) + varyant (24) — N'ye eklenir
  leak_min_gain: 1.0                 # pozitif kontrol: Sharpe ≥ temel + 1 (v1 ile aynı)
  lag_max_ratio: 0.5                 # 365 gün gecikme: Sharpe ≤ temelin %50'si
  neighbor_min_ratio: 0.5            # komşular: Sharpe > 0 ve ≥ temelin %50'si
  pbo_max: 0.5
